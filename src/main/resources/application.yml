spring:
  application:
    name: finquery-server
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:server/.env[.properties]
  main:
    lazy-initialization: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  tomcat:
    threads:
      max: 30
      min-spare: 5

spring:
  application:
    name: finquery-server
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:server/.env[.properties]
  main:
    banner-mode: off
    lazy-initialization: false
  jmx:
    enabled: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: finquery-hikari
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1KB
  tomcat:
    threads:
      max: 30
      min-spare: 5
    max-connections: 200
    accept-count: 50
    connection-timeout: 5s
    keep-alive-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    diskspace:
      enabled: false
  metrics:
    enable:
      all: false

llm:
  default-provider: ${LLM_DEFAULT_PROVIDER:gemini}
  connect-timeout: ${LLM_CONNECT_TIMEOUT:3s}
  read-timeout: ${LLM_READ_TIMEOUT:30s}
  max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:1024}
  gemini:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  ollama:
    enabled: ${OLLAMA_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:7b}

spring:
  jmx:
    enabled: false
  datasource:
    url: jdbc:h2:mem:finquery;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    diskspace:
      enabled: false
  metrics:
    enable:
      all: false

llm:
  default-provider: gemini
  connect-timeout: 3s
  read-timeout: 15s
  max-output-tokens: 1024
  gemini:
    base-url: https://generativelanguage.googleapis.com
    api-key: test-gemini-api-key
    model: gemini-2.5-flash
  ollama:
    enabled: false
    base-url: http://localhost:11434
    model: qwen2.5:7b
